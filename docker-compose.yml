version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: letsroast-postgres
    restart: always
    environment:
      POSTGRES_USER: letsroast
      POSTGRES_PASSWORD: letsroast123
      POSTGRES_DB: letsroast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letsroast"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
